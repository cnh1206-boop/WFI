name: Auto Update Portfolio and News

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Update portfolio, global markets, news, and disclosures
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: python update.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json news.json disclosures.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update portfolio briefing data" && git push)
