<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dashboard - 2차전지·반도체·세계증시</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#1E3A8A',
                            blue: '#2563EB',
                            plum: '#701A75',
                            dark: '#0F172A',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <div class="min-h-full flex flex-col">
        <!-- 1. 최상단 네비게이션 바 -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-navy via-brand-blue to-brand-plum flex items-center justify-center text-white shadow-md">
                            <i class="fa-solid fa-earth-americas text-lg"></i>
                        </div>
                        <div>
                            <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Global Intel <span class="text-brand-blue">Hub</span></span>
                            <span id="lastUpdated" class="block sm:inline-block sm:ml-2 text-[11px] px-2 py-0.5 rounded bg-brand-plum/10 text-brand-plum font-semibold">AI 자동 동기화 대기중</span>
                        </div>
                    </div>

                    <div class="hidden md:flex flex-1 max-w-md mx-8">
                        <div class="relative w-full">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                            </span>
                            <input type="text" id="searchInput" placeholder="키워드 검색 (예: 리튬, 반도체, FOMC...)" 
                                class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue dark:text-slate-200">
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <button onclick="openAddModal()" class="inline-flex items-center px-3.5 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-brand-blue hover:bg-blue-700 shadow-sm transition">
                            <i class="fa-solid fa-plus mr-1.5"></i> 수동 추가
                        </button>
                        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                            <i id="darkModeIcon" class="fa-solid fa-moon text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 2. 상단 카테고리 탭 -->
        <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex space-x-6 overflow-x-auto py-3 no-scrollbar" id="categoryTabs">
                    <button onclick="filterCategory('전체')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold bg-brand-navy text-white shadow-xs transition">전체뉴스</button>
                    <button onclick="filterCategory('2차전지·소재')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">2차전지·소재</button>
                    <button onclick="filterCategory('반도체·AI')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">반도체·AI</button>
                    <button onclick="filterCategory('세계증시·경제')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">세계
