<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dashboard - 2차전지·반도체·세계증시</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#1E3A8A',
                            blue: '#2563EB',
                            plum: '#701A75',
                            dark: '#0F172A',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <div class="min-h-full flex flex-col">
        <!-- 1. 최상단 네비게이션 바 -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <!-- 로고 -->
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-navy via-brand-blue to-brand-plum flex items-center justify-center text-white shadow-md">
                            <i class="fa-solid fa-earth-americas text-lg"></i>
                        </div>
                        <div>
                            <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Global Intel <span class="text-brand-blue">Hub</span></span>
                            <span class="hidden sm:inline-block ml-2 text-xs px-2 py-0.5 rounded bg-brand-plum/10 text-brand-plum font-semibold">Global View</span>
                        </div>
                    </div>

                    <!-- 중앙 검색바 -->
                    <div class="hidden md:flex flex-1 max-w-md mx-8">
                        <div class="relative w-full">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                            </span>
                            <input type="text" id="searchInput" placeholder="키워드 검색 (예: 리튬, 반도체, FOMC, 테슬라...)" 
                                class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue dark:text-slate-200">
                        </div>
                    </div>

                    <!-- 우측 메뉴 -->
                    <div class="flex items-center space-x-3">
                        <button onclick="openAddModal()" class="inline-flex items-center px-3.5 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-brand-blue hover:bg-blue-700 shadow-sm transition">
                            <i class="fa-solid fa-plus mr-1.5"></i> 뉴스 요약 추가
                        </button>
                        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                            <i id="darkModeIcon" class="fa-solid fa-moon text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 2. 상단 카테고리 탭 -->
        <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex space-x-6 overflow-x-auto py-3 no-scrollbar" id="categoryTabs">
                    <button onclick="filterCategory('전체')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold bg-brand-navy text-white shadow-xs transition">전체뉴스</button>
                    <button onclick="filterCategory('2차전지·소재')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">2차전지·소재</button>
                    <button onclick="filterCategory('반도체·AI')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">반도체·AI</button>
                    <button onclick="filterCategory('세계증시·경제')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">세계증시·경제</button>
                    <button onclick="filterCategory('환율·금리·원자재')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">환율·금리·원자재</button>
                    <button onclick="filterCategory('스크랩북')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">스크랩북</button>
                </div>
            </div>
        </nav>

        <!-- 3. 뉴스 키워드 바 (글로벌 확장) -->
        <div class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 py-2">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-2 overflow-x-auto no-scrollbar">
                <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0 mr-1"><i class="fa-solid fa-fire text-brand-plum mr-1"></i> Global Keywords:</span>
                <button onclick="filterKeyword('전체')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-brand-blue text-white font-medium transition">#전체보기</button>
                <button onclick="filterKeyword('미국FOMC')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#미국FOMC</button>
                <button onclick="filterKeyword('중국배터리')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#중국배터리수출</button>
                <button onclick="filterKeyword('유럽CBAM')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#유럽CBAM(탄소국경세)</button>
                <button onclick="filterKeyword('리튬반등')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#탄산리튬가격반등</button>
                <button onclick="filterKeyword('HBM4')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#HBM4양산경쟁</button>
                <button onclick="filterKeyword('대만반도체')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#대만반도체공급망</button>
            </div>
        </div>

        <!-- 4. 메인 콘텐츠 영역 (좌측 뉴스 피드 & 우측 언론사 스탠드) -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- 좌측: AI 핵심 요약 뉴스 피드 (3열 차지) -->
            <div class="lg:col-span-3 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center">
                        <i class="fa-solid fa-bolt text-brand-blue mr-2"></i> 실시간 글로벌 AI 핵심 요약 브리핑
                    </h2>
                    <span id="newsCount" class="text-xs text-slate-500 font-medium">총 6건</span>
                </div>

                <!-- 뉴스 카드 리스트 컨테이너 -->
                <div id="newsFeed" class="space-y-4">
                    <!-- 자바스크립트로 동적 렌더링됨 -->
                </div>
            </div>

            <!-- 우측: 언론사(출처) 스탠드 & 주요 지표 (1열 차지) -->
            <div class="space-y-6">
                <!-- 글로벌 언론사 스탠드 (3x3 그리드) -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-xs">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-3 flex items-center justify-between">
                        <span><i class="fa-solid fa-newspaper text-brand-navy dark:text-blue-400 mr-2"></i> 글로벌 언론사 스탠드</span>
                        <span class="text-[10px] text-slate-400 font-normal">필터링</span>
                    </h3>
                    <div class="grid grid-cols-3 gap-2" id="mediaStand">
                        <button onclick="filterMedia('all')" class="media-badge px-2 py-2 text-xs font-semibold rounded-lg bg-brand-navy text-white text-center transition">전체</button>
                        <button onclick="filterMedia('Bloomberg')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">Bloomberg</button>
                        <button onclick="filterMedia('Reuters')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">Reuters</button>
                        <button onclick="filterMedia('WSJ')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">WSJ</button>
                        <button onclick="filterMedia('FT')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">FT</button>
                        <button onclick="filterMedia('36Kr')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">36Kr(중국)</button>
                        <button onclick="filterMedia('Nikkei')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">Nikkei</button>
                        <button onclick="filterMedia('한국경제')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">한국경제</button>
                        <button onclick="filterMedia('매일경제')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">매일경제</button>
                    </div>
                </div>

                <!-- 글로벌 증시 및 원자재 미니 보드 -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-xs">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-3 flex items-center">
                        <i class="fa-solid fa-chart-line text-brand-plum mr-2"></i> 글로벌 핵심 지표
                    </h3>
                    <div class="space-y-3 text-xs">
                        <div class="flex justify-between items-center p-2 rounded-lg bg-slate-50 dark:bg-slate-900">
                            <span class="font-medium text-slate-600 dark:text-slate-400">탄산리튬 (톤당)</span>
                            <span class="font-bold text-emerald-600">+2.4% $13,400</span>
                        </div>
                        <div class="flex justify-between items-center p-2 rounded-lg bg-slate-50 dark:bg-slate-900">
                            <span class="font-medium text-slate-600 dark:text-slate-400">필라델피아 반도체</span>
                            <span class="font-bold text-rose-600">-0.8% 5,120</span>
                        </div>
                        <div class="flex justify-between items-center p-2 rounded-lg bg-slate-50 dark:bg-slate-900">
                            <span class="font-medium text-slate-600 dark:text-slate-400">원/달러 환율</span>
                            <span class="font-bold text-slate-800 dark:text-white">1,382.50원</span>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let newsData = [
            {
                id: 1,
                title: "미 연준(Fed) 파월 의장 '금리 인하 신중론' 유지… 글로벌 증시 혼조세",
                category: "세계증시·경제",
                keyword: "미국FOMC",
                region: "미국",
                media: "Bloomberg",
                date: "20시간 전",
                summary1: "인플레이션 지표가 예상치에 부합했으나 추가 데이터 확인 필요성 강조",
                summary2: "미국 국채 금리 소폭 반등하며 기술주 중심 변동성 확대",
                summary3: "유럽 및 아시아 증시 디커플링 현상 심화 조짐",
                insight: "고금리 장기화 우려 완화와 실적 장세가 맞물리는 국면으로 우량주 선별 투자 필요.",
                scraped: false
            },
            {
                id: 2,
                title: "중국 정부, 배터리 핵심 광물 수출 통제 강화… 글로벌 공급망 재편 촉각",
                category: "2차전지·소재",
                keyword: "중국배터리",
                region: "중국",
                media: "36Kr",
                date: "1시간 전",
                summary1: "흑연 및 주요 배터리 소재 수출 허가 심사 대폭 강화",
                summary2: "한국·유럽 배터리 셀 업체들 대체 공급망 확보 총력",
                summary3: "북미 및 호주 광산 개발 기업들의 반사이익 기대감 상승",
                insight: "중국 의존도가 높은 2차전지 소재 기업들의 다변화 진행 속도가 핵심 주가 변곡점.",
                scraped: false
            },
            {
                id: 3,
                title: "EU, 탄소국경조정제도(CBAM) 본격 적용 임박… 철강·배터리 수출 타격 우려",
                category: "환율·금리·원자재",
                keyword: "유럽CBAM",
                region: "유럽",
                media: "FT",
                date: "3시간 전",
                summary1: "대(對)유럽 수출 기업들의 탄소 배출량 보고 의무화 본격 시행",
                summary2: "국내 철강 및 배터리 소재 업계 친환경 공정 전환 압박 가중",
                summary3: "규제 미달 시 관세 부과로 인한 가격 경쟁력 약화 우려",
                insight: "유럽 수출 비중이 높은 기업들의 ESG 대응 성과가 실적 방어의 핵심 지표.",
                scraped: false
            },
            {
                id: 4,
                title: "엔비디아·TSMC, 차세대 HBM4 양산 체제 돌입… AI 반도체 패권 경쟁 격화",
                category: "반도체·AI",
                keyword: "HBM4",
                region: "글로벌",
                media: "Reuters",
                date: "4시간 전",
                summary1: "커스텀 다이(Custom Die) 도입으로 전력 효율 대폭 개선",
                summary2: "SK하이닉스 및 삼성전자 등 메모리 파트너사들과의 협력 가속화",
                summary3: "AI 가속기 성능 한계 돌파를 위한 파운드리-메모리 동맹 강화",
                insight: "HBM4 생태계 내 핵심 공급망에 위치한 국내 반도체 소부장 기업 주목.",
                scraped: false
            },
            {
                id: 5,
                title: "글로벌 탄산리튬 가격 바닥 통과하나?… 아시아 현물시장 매수세 유입",
                category: "2차전지·소재",
                keyword: "리튬반등",
                region: "글로벌",
                media: "WSJ",
                date: "6시간 전",
                summary1: "일부 중국 배터리 셀 업체의 재고 소진 후 저가 매수세 유입",
                summary2: "생산업체들의 감산 효과로 공급 과잉 폭 점진적 축소",
                summary3: "전기차 수요 둔화 우려 속 바닥 다지기 국면 진입",
                insight: "리튬 가격 안정화는 양극재 및 배터리 셀 업체의 마진율 개선으로 직결됨.",
                scraped: false
            },
            {
                id: 6,
                title: "대만 TSMC, 첨단 공정 가동률 100% 지속… 글로벌 빅테크 수요 견조",
                category: "반도체·AI",
                keyword: "대만반도체",
                region: "대만",
                media: "Nikkei",
                date: "8시간 전",
                summary1: "애플, 마이크로소프트, 구글 등 주요 AI 칩 주문 풀가동",
                summary2: "지정학적 리스크에도 불구하고 글로벌 반도체 허브 지위 공고",
                summary3: "국내 파운드리 및 시스템 반도체 생태계에 미치는 영향 분석",
                insight: "글로벌 빅테크의 AI 인프라 투자가 여전히 꺾이지 않았음을 증명하는 지표.",
                scraped: false
            }
        ];

        let currentCategory = '전체';
        let currentKeyword = '전체';
        let currentMedia = 'all';

        function renderNews() {
            const feed = document.getElementById('newsFeed');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = newsData.filter(item => {
                const matchCat = (currentCategory === '전체' || item.category === currentCategory || (currentCategory === '스크랩북' && item.scraped));
                const matchKey = (currentKeyword === '전체' || item.keyword === currentKeyword);
                const matchMedia = (currentMedia === 'all' || item.media === currentMedia);
                const matchSearch = item.title.toLowerCase().includes(searchVal) || item.summary1.toLowerCase().includes(searchVal);
                return matchCat && matchKey && matchMedia && matchSearch;
            });

            document.getElementById('newsCount').innerText = `총 ${filtered.length}건`;

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-12 text-center text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                        <p class="text-sm font-medium">조건에 일치하는 뉴스가 없습니다.</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filtered.map(item => `
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-xs hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs px-2.5 py-1 rounded-md bg-brand-navy/10 text-brand-navy dark:bg-blue-900/30 dark:text-blue-300 font-semibold">${item.media}</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-brand-plum/10 text-brand-plum dark:bg-purple-900/30 dark:text-purple-300 font-medium">${item.region}</span>
                            <span class="text-xs text-slate-400">${item.date}</span>
                        </div>
                        <button onclick="toggleScrap(${item.id})" class="text-slate-400 hover:text-brand-plum transition">
                            <i class="${item.scraped ? 'fa-solid text-brand-plum' : 'fa-regular'} fa-bookmark text-base"></i>
                        </button>
                    </div>

                    <h3 class="text-base font-bold text-slate-900 dark:text-white mb-3 hover:text-brand-blue cursor-pointer transition">
                        ${item.title}
                    </h3>

                    <div class="bg-slate-50 dark:bg-slate-900/60 rounded-xl p-3.5 space-y-2 mb-3 text-sm border border-slate-100 dark:border-slate-700/50">
                        <div class="flex items-start space-x-2">
                            <span class="text-xs font-bold text-brand-blue shrink-0 mt-0.5">01</span>
                            <p class="text-slate-700 dark:text-slate-300">${item.summary1}</p>
                        </div>
                        <div class="flex items-start space-x-2">
                            <span class="text-xs font-bold text-brand-blue shrink-0 mt-0.5">02</span>
                            <p class="text-slate-700 dark:text-slate-300">${item.summary2}</p>
                        </div>
                        <div class="flex items-start space-x-2">
                            <span class="text-xs font-bold text-brand-blue shrink-0 mt-0.5">03</span>
                            <p class="text-slate-700 dark:text-slate-300">${item.summary3}</p>
                        </div>
                    </div>

                    <div class="bg-brand-plum/5 dark:bg-purple-950/20 border-l-2 border-brand-plum p-3 rounded-r-xl flex items-start space-x-2">
                        <i class="fa-solid fa-lightbulb text-brand-plum text-sm mt-0.5 shrink-0"></i>
                        <p class="text-xs text-slate-700 dark:text-slate-300 font-medium leading-relaxed">
                            <strong class="text-brand-plum">핵심 시사점:</strong> ${item.insight}
                        </p>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === '전체' && btn.innerText === '전체뉴스')) {
                    btn.className = "category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold bg-brand-navy text-white shadow-xs transition";
                } else {
                    btn.className = "category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition";
                }
            });
            renderNews();
        }

        function filterKeyword(key) {
            currentKeyword = key;
            document.querySelectorAll('.keyword-chip').forEach(chip => {
                if (chip.innerText.includes(key) || (key === '전체' && chip.innerText.includes('전체'))) {
                    chip.className = "keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-brand-blue text-white font-medium transition";
                } else {
                    chip.className = "keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition";
                }
            });
            renderNews();
        }

        function filterMedia(media) {
            currentMedia = media;
            document.querySelectorAll('.media-badge').forEach(badge => {
                if ((media === 'all' && badge.innerText === '전체') || badge.innerText.includes(media)) {
                    badge.className = "media-badge px-2 py-2 text-xs font-semibold rounded-lg bg-brand-navy text-white text-center transition";
                } else {
                    badge.className = "media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition";
                }
            });
            renderNews();
        }

        function toggleScrap(id) {
            const item = newsData.find(n => n.id === id);
            if (item) {
                item.scraped = !item.scraped;
                renderNews();
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('darkModeIcon');
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                icon.className = "fa-solid fa-sun text-lg text-yellow-400";
            } else {
                icon.className = "fa-solid fa-moon text-lg";
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderNews);

        function openAddModal() {
            const title = prompt("추가할 뉴스 기사 제목을 입력하세요:");
            if (!title) return;
            const insight = prompt("AI 분석 및 투자 시사점을 입력하세요:");
            
            newsData.unshift({
                id: Date.now(),
                title: title,
                category: "반도체·AI",
                keyword: "글로벌속보",
                region: "글로벌",
                media: "Bloomberg",
                date: "방금 전",
                summary1: "신규 등록된 글로벌 기사 자동 파싱 완료",
                summary2: "관련 공급망 및 주가 영향 모니터링 필요",
                summary3: "주요 기관 및 애널리스트 코멘트 주시",
                insight: insight || "특이사항 점검 후 투자 포트폴리오 반영 권장.",
                scraped: false
            });
            renderNews();
        }

        renderNews();
    </script>
</body>
</html>
