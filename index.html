<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dashboard - 2차전지·반도체·세계증시</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#1E3A8A',
                            blue: '#2563EB',
                            plum: '#701A75',
                            dark: '#0F172A',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <div class="min-h-full flex flex-col">
        <!-- 1. 최상단 네비게이션 바 -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-navy via-brand-blue to-brand-plum flex items-center justify-center text-white shadow-md">
                            <i class="fa-solid fa-earth-americas text-lg"></i>
                        </div>
                        <div>
                            <span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Global Intel <span class="text-brand-blue">Hub</span></span>
                            <span id="lastUpdated" class="block sm:inline-block sm:ml-2 text-[11px] px-2 py-0.5 rounded bg-brand-plum/10 text-brand-plum font-semibold">AI 자동 동기화 대기중</span>
                        </div>
                    </div>

                    <div class="hidden md:flex flex-1 max-w-md mx-8">
                        <div class="relative w-full">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                            </span>
                            <input type="text" id="searchInput" placeholder="키워드 검색 (예: 리튬, 반도체, FOMC...)" 
                                class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue dark:text-slate-200">
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <button onclick="openAddModal()" class="inline-flex items-center px-3.5 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-brand-blue hover:bg-blue-700 shadow-sm transition">
                            <i class="fa-solid fa-plus mr-1.5"></i> 수동 추가
                        </button>
                        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                            <i id="darkModeIcon" class="fa-solid fa-moon text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 2. 상단 카테고리 탭 -->
        <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex space-x-6 overflow-x-auto py-3 no-scrollbar" id="categoryTabs">
                    <button onclick="filterCategory('전체')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold bg-brand-navy text-white shadow-xs transition">전체뉴스</button>
                    <button onclick="filterCategory('2차전지·소재')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">2차전지·소재</button>
                    <button onclick="filterCategory('반도체·AI')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">반도체·AI</button>
                    <button onclick="filterCategory('세계증시·경제')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">세계증시·경제</button>
                    <button onclick="filterCategory('보유종목 뉴스')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">보유종목 뉴스</button>
                    <button onclick="filterCategory('환율·금리·원자재')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">환율·금리·원자재</button>
                    <button onclick="filterCategory('월가·유튜버 인사이트')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">월가·유튜버 인사이트</button>
                    <button onclick="filterCategory('스크랩북')" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">스크랩북</button>
                </div>
            </div>
        </nav>

        <!-- 3. 뉴스 키워드 바 -->
        <div class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-700 py-2">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-2 overflow-x-auto no-scrollbar">
                <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0 mr-1"><i class="fa-solid fa-fire text-brand-plum mr-1"></i> Global Keywords:</span>
                <button onclick="filterKeyword('전체')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-brand-blue text-white font-medium transition">#전체보기</button>
                <button onclick="filterKeyword('보유종목')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#보유종목뉴스</button>
                <button onclick="filterKeyword('세계시장')" class="keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition">#세계시장</button>
            </div>
        </div>

        <!-- 4. 메인 콘텐츠 영역 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-8">
            <section class="lg:col-span-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-xs">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900 dark:text-white"><i class="fa-solid fa-chart-line text-brand-blue mr-2"></i>내 보유종목 · 세계 증시</h2>
                        <p id="portfolioUpdated" class="text-xs text-slate-500 mt-1">자동 시세 업데이트를 기다리는 중</p>
                    </div>
                    <span class="text-[11px] text-slate-500">수량·매입가 없이 종목명과 시세만 표시</span>
                </div>
                <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">주요 지수</h3>
                <div id="marketGrid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 mb-5"></div>
                <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">내 종목</h3>
                <div id="holdingsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
                <div class="mt-5 border-t border-slate-200 dark:border-slate-700 pt-4">
                    <h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2"><i class="fa-solid fa-file-lines mr-1"></i>최근 보유기업 공시</h3>
                    <div id="disclosureList" class="text-sm text-slate-500">공시 정보를 불러오는 중</div>
                </div>
            </section>
            <div class="lg:col-span-3 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center">
                        <i class="fa-solid fa-bolt text-brand-blue mr-2"></i> 글로벌 · 보유종목 뉴스 원문
                    </h2>
                    <span id="newsCount" class="text-xs text-slate-500 font-medium">로딩중...</span>
                </div>

                <div id="newsFeed" class="space-y-4"></div>
            </div>

            <div class="space-y-6">
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-xs">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-3 flex items-center justify-between">
                        <span><i class="fa-solid fa-newspaper text-brand-navy dark:text-blue-400 mr-2"></i> 글로벌 언론사 필터</span>
                    </h3>
                    <div class="grid grid-cols-3 gap-2" id="mediaStand">
                        <button onclick="filterMedia('all')" class="media-badge px-2 py-2 text-xs font-semibold rounded-lg bg-brand-navy text-white text-center transition">전체</button>
                        <button onclick="filterMedia('Bloomberg')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">Bloomberg</button>
                        <button onclick="filterMedia('Reuters')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">Reuters</button>
                        <button onclick="filterMedia('WSJ')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">WSJ</button>
                        <button onclick="filterMedia('FT')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">FT</button>
                        <button onclick="filterMedia('CNBC')" class="media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition">CNBC</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let newsData = [];

        let currentCategory = '전체';
        let currentKeyword = '전체';
        let currentMedia = 'all';

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        }

        function safeUrl(value) {
            return /^https:\/\//i.test(String(value || '')) ? escapeHtml(value) : '#';
        }

        function formatQuote(value, currency) {
            if (value === null || value === undefined) return '시세 확인 불가';
            if (currency === 'PERCENT') return new Intl.NumberFormat('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value) + '%';
            const digits = currency === 'KRW' ? 0 : 2;
            return new Intl.NumberFormat('ko-KR', { maximumFractionDigits: digits }).format(value) + (currency === 'USD' ? ' USD' : currency === 'POINTS' ? ' pt' : '원');
        }

        async function loadPortfolio() {
            try {
                const [portfolioRes, disclosuresRes] = await Promise.all([
                    fetch('./portfolio.json?t=' + Date.now()),
                    fetch('./disclosures.json?t=' + Date.now())
                ]);
                if (portfolioRes.ok) {
                    const data = await portfolioRes.json();
                    document.getElementById('portfolioUpdated').innerText = `시세 기준: ${data.updated_at || '정보 없음'} · 데이터 제공: Yahoo Finance`;
                    document.getElementById('marketGrid').innerHTML = (data.indices || []).map(item => {
                        const positive = Number(item.change) >= 0;
                        const color = positive ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400';
                        const change = item.change_percent == null ? '—' : item.currency === 'PERCENT'
                            ? `${positive ? '+' : ''}${Number(item.change).toFixed(2)}%p`
                            : `${positive ? '+' : ''}${Number(item.change_percent).toFixed(2)}%`;
                        return `<div class="rounded-xl bg-slate-50 dark:bg-slate-900 p-3 border border-slate-100 dark:border-slate-700"><div class="text-xs text-slate-500 truncate">${escapeHtml(item.name)}</div><div class="font-bold text-sm mt-1">${formatQuote(item.price, item.currency)}</div><div class="text-xs ${color} mt-1">${change}</div></div>`;
                    }).join('') || '<p class="text-sm text-slate-500">지수 데이터가 아직 없습니다.</p>';
                    document.getElementById('holdingsGrid').innerHTML = (data.holdings || []).map(item => {
                        const positive = Number(item.change) >= 0;
                        const color = positive ? 'text-red-600 dark:text-red-400' : 'text-blue-600 dark:text-blue-400';
                        const change = item.change_percent == null ? '시세 확인 필요' : `${positive ? '+' : ''}${formatQuote(item.change, item.currency)} (${positive ? '+' : ''}${Number(item.change_percent).toFixed(2)}%)`;
                        return `<article class="rounded-xl bg-slate-50 dark:bg-slate-900 p-4 border border-slate-100 dark:border-slate-700"><div class="flex justify-between gap-3"><div class="font-semibold text-sm">${escapeHtml(item.name)}</div><span class="text-xs text-slate-400 shrink-0">${escapeHtml(item.ticker)}</span></div><div class="flex justify-between items-end mt-3 gap-2"><div class="font-bold text-lg">${formatQuote(item.price, item.currency)}</div><div class="text-xs ${color} text-right">${change}</div></div><div class="text-[11px] text-slate-400 mt-2">기준일 ${escapeHtml(item.as_of || '데이터 없음')}</div></article>`;
                    }).join('') || '<p class="text-sm text-slate-500">보유 종목 데이터가 아직 없습니다.</p>';
                }
                if (disclosuresRes.ok) {
                    const data = await disclosuresRes.json();
                    const list = data.items || [];
                    document.getElementById('disclosureList').innerHTML = list.length
                        ? list.slice(0, 10).map(item => `<div class="py-2 border-b border-slate-100 dark:border-slate-700"><a class="text-brand-blue hover:underline" href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a><span class="ml-2 text-xs text-slate-400">${escapeHtml(item.company)} · ${escapeHtml(item.date)}</span></div>`).join('')
                        : (data.configured ? '최근 14일 동안 보유기업의 공시가 없습니다.' : '공시 자동 수집을 사용하려면 GitHub 저장소 Secret에 OPEN_DART_API_KEY를 등록해야 합니다.');
                }
            } catch (error) {
                document.getElementById('portfolioUpdated').innerText = '시세 데이터를 불러오지 못했습니다. 다음 자동 업데이트를 기다려 주세요.';
            }
        }

        async function loadAutoNews() {
            try {
                const res = await fetch('./news.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    newsData = data.articles || [];
                    document.getElementById('lastUpdated').innerText = `업데이트: ${data.updated_at || '정보 없음'}`;
                }
            } catch (e) {
                console.log('아직 생성된 news.json이 없어 기본 안내를 표시합니다.');
            }
            renderNews();
        }

        function renderNews() {
            const feed = document.getElementById('newsFeed');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = newsData.filter(item => {
                const matchCat = (currentCategory === '전체' || item.category === currentCategory || (currentCategory === '스크랩북' && item.scraped));
                const matchKey = (currentKeyword === '전체' || item.keyword === currentKeyword);
                const matchMedia = (currentMedia === 'all' || (item.media && item.media.toLowerCase().includes(currentMedia.toLowerCase())));
                const matchSearch = item.title.toLowerCase().includes(searchVal) || item.summary1.toLowerCase().includes(searchVal);
                return matchCat && matchKey && matchMedia && matchSearch;
            });

            document.getElementById('newsCount').innerText = `총 ${filtered.length}건`;

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-12 text-center text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                        <p class="text-sm font-medium">조건에 일치하는 뉴스가 없습니다.</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filtered.map(item => `
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-xs hover:shadow-md transition">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs px-2.5 py-1 rounded-md bg-brand-navy/10 text-brand-navy dark:bg-blue-900/30 dark:text-blue-300 font-semibold">${escapeHtml(item.media)}</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-brand-plum/10 text-brand-plum dark:bg-purple-900/30 dark:text-purple-300 font-medium">${escapeHtml(item.region)}</span>
                            <span class="text-xs text-slate-400">${escapeHtml(item.date)}</span>
                        </div>
                        <button onclick="toggleScrap(${item.id})" class="text-slate-400 hover:text-brand-plum transition">
                            <i class="${item.scraped ? 'fa-solid text-brand-plum' : 'fa-regular'} fa-bookmark text-base"></i>
                        </button>
                    </div>

                    <h3 class="text-base font-bold text-slate-900 dark:text-white mb-3 hover:text-brand-blue cursor-pointer transition">
                        ${item.source_url ? `<a href="${safeUrl(item.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>` : escapeHtml(item.title)}
                    </h3>

                    <div class="bg-slate-50 dark:bg-slate-900/60 rounded-xl p-3.5 space-y-2 mb-3 text-sm border border-slate-100 dark:border-slate-700/50">
                        <div class="flex items-start space-x-2">
                            <span class="text-xs font-bold text-brand-blue shrink-0 mt-0.5">01</span>
                            <p class="text-slate-700 dark:text-slate-300">${escapeHtml(item.summary1)}</p>
                        </div>
                        <div class="flex items-start space-x-2">
                            <span class="text-xs font-bold text-brand-blue shrink-0 mt-0.5">02</span>
                            <p class="text-slate-700 dark:text-slate-300">${escapeHtml(item.summary2)}</p>
                        </div>
                        <div class="flex items-start space-x-2">
                            <span class="text-xs font-bold text-brand-blue shrink-0 mt-0.5">03</span>
                            <p class="text-slate-700 dark:text-slate-300">${escapeHtml(item.summary3)}</p>
                        </div>
                    </div>

                    <div class="bg-brand-plum/5 dark:bg-purple-950/20 border-l-2 border-brand-plum p-3 rounded-r-xl flex items-start space-x-2">
                        <i class="fa-solid fa-lightbulb text-brand-plum text-sm mt-0.5 shrink-0"></i>
                        <p class="text-xs text-slate-700 dark:text-slate-300 font-medium leading-relaxed">
                            <strong class="text-brand-plum">핵심 시사점:</strong> ${escapeHtml(item.insight)}
                        </p>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === '전체' && btn.innerText === '전체뉴스')) {
                    btn.className = "category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold bg-brand-navy text-white shadow-xs transition";
                } else {
                    btn.className = "category-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition";
                }
            });
            renderNews();
        }

        function filterKeyword(key) {
            currentKeyword = key;
            document.querySelectorAll('.keyword-chip').forEach(chip => {
                if ((key === '전체' && chip.innerText.includes('전체')) || chip.getAttribute('onclick').includes(key)) {
                    chip.className = "keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-brand-blue text-white font-medium transition";
                } else {
                    chip.className = "keyword-chip shrink-0 text-xs px-3 py-1 rounded-md bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:border-brand-blue transition";
                }
            });
            renderNews();
        }

        function filterMedia(media) {
            currentMedia = media;
            document.querySelectorAll('.media-badge').forEach(badge => {
                if ((media === 'all' && badge.innerText === '전체') || badge.innerText.includes(media)) {
                    badge.className = "media-badge px-2 py-2 text-xs font-semibold rounded-lg bg-brand-navy text-white text-center transition";
                } else {
                    badge.className = "media-badge px-2 py-2 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center hover:bg-slate-200 transition";
                }
            });
            renderNews();
        }

        function toggleScrap(id) {
            const item = newsData.find(n => n.id === id);
            if (item) {
                item.scraped = !item.scraped;
                renderNews();
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('darkModeIcon');
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                icon.className = "fa-solid fa-sun text-lg text-yellow-400";
            } else {
                icon.className = "fa-solid fa-moon text-lg";
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderNews);

        function openAddModal() {
            const title = prompt("추가할 뉴스 기사 제목을 입력하세요:");
            if (!title) return;
            const insight = prompt("AI 분석 및 투자 시사점을 입력하세요:");
            
            newsData.unshift({
                id: Date.now(),
                title: title,
                category: "반도체·AI",
                keyword: "HBM4",
                region: "글로벌",
                media: "수동등록",
                date: "방금 전",
                summary1: "사용자 직접 등록 브리핑",
                summary2: "관련 공급망 및 주가 영향 모니터링",
                summary3: "포트폴리오 점검 반영",
                insight: insight || "특이사항 점검 후 투자 전략 반영 권장.",
                scraped: false
            });
            renderNews();
        }

        loadPortfolio();
        loadAutoNews();
    </script>
</body>
</html>
